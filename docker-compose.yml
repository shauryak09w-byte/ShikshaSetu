services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shikshasetu}
      POSTGRES_USER: ${POSTGRES_USER:-shikshasetu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project-root .env file}
    volumes:
      - shikshasetu-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend-fastapi
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend-fastapi/.env
    environment:
      SHIKSHASETU_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-shikshasetu}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-shikshasetu}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in the project-root .env file}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in the project-root .env file}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend-fastapi/data:/app/data
      # For local container use, optionally mount a Firebase service account read-only:
      # - ./backend-fastapi/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  shikshasetu-postgres:
