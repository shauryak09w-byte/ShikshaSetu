spring.application.name=shikshasetu
server.port=8080

# Default profile uses MySQL. Use the "dev" profile for H2 during development.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shikshasetu?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.write-dates-as-timestamps=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Trained ML artifact location
shikshasetu.ai.model-path=${AI_MODEL_PATH:./data/ai-models/student-deterioration.model}

# Institutional portal authentication and privacy controls
shikshasetu.auth.session-hours=${PORTAL_SESSION_HOURS:8}
shikshasetu.privacy.chat-retention-days=${CHAT_RETENTION_DAYS:90}
# Set both values securely on first deployment to bootstrap the initial platform Super Admin.
shikshasetu.bootstrap.super-admin-email=${BOOTSTRAP_SUPER_ADMIN_EMAIL:}
shikshasetu.bootstrap.super-admin-password=${BOOTSTRAP_SUPER_ADMIN_PASSWORD:}

# Comma-separated trusted frontend origins. Set PORTAL_ALLOWED_ORIGINS for production.
shikshasetu.cors.allowed-origin-patterns=${PORTAL_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
